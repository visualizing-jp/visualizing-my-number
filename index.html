<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイナンバーの可視化 分類から図形をつくる</title>
<script>document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>マイナンバーの可視化</h1>
    <p>12桁の数字列から、同じルールで異なるロゴをつくる</p>
  </div>
  <nav class="pages" aria-label="ページ"><a href="index.html" aria-current="page">分類から</a><a href="works.html">作品から</a></nav>
  <div class="nums">
    <label>数字列 A<input id="numA" inputmode="numeric" maxlength="12" autocomplete="off" spellcheck="false"></label>
    <label>数字列 B<input id="numB" inputmode="numeric" maxlength="12" autocomplete="off" spellcheck="false"></label>
    <button type="button" id="btnRandom">ランダム</button>
    <button type="button" id="btnReset">課題データに戻す</button>
  </div>
  <p class="warn" id="warn" role="status"></p>
</header>

<main><section id="picker" class="panel"></section><div id="app"></div></main>
<div id="printArea" aria-hidden="true"></div>

<script>
// 古いファイルがブラウザに残らないよう、読み込むたびに取り直す
['core', 'rules', 'view', 'shapes'].forEach(n => document.write('<script src="' + n + '.js?t=' + Date.now() + '"><\/script>'));
</script>
</body>
</html>
